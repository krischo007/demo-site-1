<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Business Website</title>
  <meta name="description" content="Functional demo website for small business portfolio">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Demo Business</h1>
  <nav>
    <a href="#services">Услуги</a>
    <a href="#contact">Контакт</a>
  </nav>
</header>

<main>
  <section>
    <h2>Професионален сайт за малък бизнес</h2>
    <p>Това е демо проект с реална структура и функционалност.</p>
    <button id="ctaBtn">Свържи се с нас</button>
  </section>

  <section id="services">
    <h2>Услуги</h2>
    <ul>
      <li>Изработка на уебсайтове</li>
      <li>Интеграция на чат</li>
      <li>Поддръжка</li>
    </ul>
  </section>

  <section id="contact">
    <h2>Контакт</h2>
    <form>
      <input type="text" placeholder="Име" required>
      <input type="email" placeholder="Имейл" required>
      <textarea placeholder="Съобщение"></textarea>
      <button type="submit">Изпрати</button>
    </form>
  </section>
</main>

<footer>
  <p>Demo project for portfolio</p>
</footer>

<script src="main.js"></script>
</body>
</html>
